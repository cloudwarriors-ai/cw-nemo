[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

# Coverage configuration - run with: pytest --cov
# Full coverage report: pytest --cov --cov-report=html --cov-report=term-missing

[coverage:run]
source = src
branch = true
omit =
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
fail_under = 0
show_missing = true
precision = 2

[coverage:html]
directory = htmlcov
